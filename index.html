<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zvuvim</title>
<meta name="description" content="Zvuvim makes things that help people notice the world they already live in.">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --accent: #1a6b4a;
    --muted: #5a5a5a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f0f0f0;
      --bg: #14171a;
      --accent: #5fd9a4;
      --muted: #a0a0a0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
  }
  p.tagline {
    color: var(--muted);
    font-size: 1.1rem;
    margin-top: 0;
  }
  h2 {
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-top: 3rem;
  }
  .project {
    display: block;
    border: 1px solid rgba(128,128,128,0.3);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    text-decoration: none;
    color: var(--fg);
  }
  .project:hover {
    border-color: var(--accent);
  }
  .project h3 {
    margin: 0 0 0.25rem;
    color: var(--accent);
  }
  .project p {
    margin: 0;
    color: var(--muted);
  }
  footer {
    margin-top: 4rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<main>
  <h1>Zvuvim</h1>
  <p class="tagline">We make things that help people notice the world they already live in.</p>

  <h2>Projects</h2>
  <a class="project" href="/wild-echo/">
    <h3>Wild Echo</h3>
    <p>Answer a wild call, then meet who's calling.</p>
  </a>

  <footer>One project so far. More lands here as it ships.</footer>
</main>
</body>
</html>
